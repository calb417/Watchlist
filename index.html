<!-- ON-SCREEN ERROR DISPLAY: loads first so it can catch problems anywhere in the app -->
<script>
(function () {
  var errs = [], open = true;
  function bar() {
    var b = document.getElementById('errbar');
    if (!b && document.body) { b = document.createElement('div'); b.id = 'errbar'; document.body.appendChild(b); }
    return b;
  }
  function stamp() { var d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return (n < 10 ? '0' : '') + n; }).join(':'); }
  function text() {
    return 'Watchlist v' + (window.APP_VERSION || '?') + ' · ' + (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches) ? 'Home Screen' : 'browser') + '\n' +
      errs.map(function (e) { return e.t + '  ' + e.m + (e.n > 1 ? '  (x' + e.n + ')' : ''); }).join('\n');
  }
  function render() {
    var b = bar(); if (!b) return;
    if (!errs.length) { b.style.display = 'none'; b.innerHTML = ''; return; }
    b.style.display = 'block';
    b.innerHTML = '<div class="eh"><span>&#9888; ' + errs.length + ' problem' + (errs.length > 1 ? 's' : '') + '</span><span>' +
      '<button data-e="copy">Copy</button><button data-e="clear">Clear</button><button data-e="tog">' + (open ? 'Hide' : 'Show') + '</button></span></div>' +
      (open ? '<pre></pre>' : '');
    if (open) b.querySelector('pre').textContent = text();
  }
  window.showProblem = function (where, err) {
    var msg = (err && err.message) ? err.message : String(err);
    var m = (where ? where + ': ' : '') + msg;
    for (var i = 0; i < errs.length; i++) if (errs[i].m === m) { errs[i].n++; errs[i].t = stamp(); render(); return; }
    errs.push({ t: stamp(), m: m, n: 1 }); if (errs.length > 30) errs.shift();
    open = true; render();
  };
  window.addEventListener('error', function (e) {
    window.showProblem('Error', (e.message || 'Unknown error') + ' (line ' + (e.lineno || '?') + ':' + (e.colno || '?') + ')');
  });
  window.addEventListener('unhandledrejection', function (e) { window.showProblem('Unhandled', e.reason); });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('#errbar [data-e]'); if (!btn) return;
    var k = btn.getAttribute('data-e');
    if (k === 'clear') { errs = []; render(); }
    else if (k === 'tog') { open = !open; render(); }
    else if (k === 'copy') {
      var t = text();
      var done = function () { btn.textContent = 'Copied'; setTimeout(render, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { fallback(t); done(); });
      else { fallback(t); done(); }
    }
  });
  function fallback(t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} ta.remove(); }
  document.addEventListener('DOMContentLoaded', render);
})();
</script>

<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --text: #111114; --sub: #6c6c72; --line: rgba(0,0,0,.08);
  --accent: #ff5a36; --good: #1d9a52; --chip: #ebebf0; --head: #141418; --danger: #e5383b; --purple: #7b68ee;
  --banner: #fff3e0; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --hh: 52px; --tb: 58px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #17171b; --text: #f2f2f5; --sub: #9a9aa3; --line: rgba(255,255,255,.09);
    --accent: #ff6a45; --good: #3fcf78; --chip: #26262c; --head: #0d0d10; --banner: #2b1e10; --shadow: none; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  padding: calc(var(--hh) + var(--st)) env(safe-area-inset-right) calc(var(--tb) + var(--sb) + 24px) env(safe-area-inset-left);
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
img { -webkit-user-drag: none; -webkit-touch-callout: none; }
svg { display: block; }

/* Header */
#top { position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: calc(var(--hh) + var(--st)); padding: var(--st) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  background: var(--head); color: #fff; display: flex; align-items: center; justify-content: space-between; }
#profBtn { background: rgba(255,255,255,.12); border: 0; color: #fff; border-radius: 999px; padding: 7px 13px; font-weight: 600; font-size: 15px; max-width: 55vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr { display: flex; gap: 2px; }
.ib { width: 42px; height: 42px; border: 0; background: none; color: #fff; display: grid; place-items: center; border-radius: 12px; }
.ib:active { background: rgba(255,255,255,.12); }
.ib svg { width: 24px; height: 24px; }
#refBtn.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#ptr { position: fixed; z-index: 15; left: 0; right: 0; top: calc(var(--hh) + var(--st)); text-align: center; font-size: 13px; color: var(--sub); padding: 9px; opacity: 0; transform: translateY(-6px); transition: transform .15s; pointer-events: none; }
#ptr.show { transform: none; }

main { max-width: 680px; margin: 0 auto; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; }
.ph h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
.pill { background: var(--card); border: 0; border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); }
.sec { margin: 18px 18px 8px; font-size: 13px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .05em; }
.sec-empty { margin: 0 18px; font-size: 14px; color: var(--sub); }
.list { padding: 0 12px; }
.empty { text-align: center; color: var(--sub); padding: 50px 30px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
.banner { margin: 12px 14px 0; background: var(--banner); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
.banner button { flex: none; border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 7px 11px; font-weight: 600; font-size: 14px; }

/* Cards */
.row { position: relative; margin-bottom: 8px; border-radius: 14px; overflow: hidden; touch-action: pan-y;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.acts { position: absolute; top: 0; right: 0; bottom: 0; display: flex; visibility: hidden; }
.row.open .acts, .row.swiping .acts { visibility: visible; }
.acts button { width: 86px; border: 0; color: #fff; font-weight: 600; font-size: 15px; }
.a-arch { background: var(--purple); }
.a-del { background: var(--danger); }
.card { position: relative; z-index: 1; background: var(--card); display: flex; align-items: center; gap: 11px; height: 60px; padding: 5px 6px 5px 5px; border-radius: 14px; box-shadow: var(--shadow); cursor: pointer; }
.card .poster { width: 33px; height: 50px; border-radius: 6px; font-size: 15px; }
.card.snap { transition: transform .22s ease; }
.row.dragging { z-index: 10; overflow: visible; }
.row.dragging .acts { display: none; }
.row.dragging .card { box-shadow: 0 14px 34px rgba(0,0,0,.28); transform: scale(1.025); transition: transform .12s; }
.poster { flex: none; width: 62px; height: 93px; border-radius: 9px; object-fit: cover; background: var(--chip); }
.poster.ph { display: grid; place-items: center; font-weight: 700; font-size: 24px; color: var(--sub); }
.info { flex: 1; min-width: 0; }
.t { font-size: 16px; font-weight: 650; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 13.5px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.sub .badge { font-size: 11.5px; padding: 1px 7px; }
.svc { color: var(--text); font-weight: 500; }
.scores { color: var(--text); }
.imdbs { background: #f5c518; color: #000; font-size: 10px; font-weight: 700; padding: 0 3px; border-radius: 3px; vertical-align: 1px; }
.card.noposter { padding-left: 14px; }
.sw { flex: none; position: relative; width: 46px; height: 28px; border-radius: 14px; background: var(--chip); transition: background .15s; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.sw.on { background: var(--good); }
.sw.on::after { transform: translateX(18px); }
.gi .sl { flex: 1; min-width: 0; }
.svc img { width: 16px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-right: 4px; }
.yr { color: var(--sub); font-weight: 400; font-size: 14px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; margin-top: 3px; font-size: 13px; color: var(--sub); }
.meta .im b { background: #f5c518; color: #000; font-size: 10.5px; padding: 1px 4px; border-radius: 4px; margin-right: 3px; }
.meta .rt { color: var(--text); }
.st { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 2px 0 0; font-size: 13.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.st .behind { color: var(--accent); font-weight: 700; }
.st .ok { color: var(--good); font-weight: 600; }
.dim { color: var(--sub); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--chip); color: var(--sub); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 1px; }
.tag.end { background: var(--purple); color: #fff; }
.badge { display: inline-block; background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; }
.logos { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
.logos img { width: 24px; height: 24px; border-radius: 6px; }
.logos span { font-size: 12px; color: var(--sub); }
.plus { flex: none; width: 50px; height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 800; }
.plus:disabled { background: var(--chip); color: var(--sub); }
.plus.txt { width: 72px; padding: 0; font-size: 14.5px; font-weight: 700; }
.plus.txt.quiet { background: var(--chip); color: var(--text); }

/* Tab bar */
#tabs { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: calc(var(--tb) + var(--sb)); padding-bottom: var(--sb); display: flex;
  background: var(--card); background: color-mix(in srgb, var(--card) 90%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
#tabs button { position: relative; flex: 1; border: 0; background: none; color: var(--sub); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; }
#tabs button svg { width: 25px; height: 25px; }
#tabs button.on { color: var(--accent); }
.dot { position: absolute; top: 5px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; font-style: normal; }
body.welcome #top, body.welcome #tabs { display: none; }
body.welcome { padding-top: 0; }

/* Toast */
#toast { position: fixed; z-index: 70; left: 50%; bottom: calc(var(--tb) + var(--sb) + 14px); transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: #26262b; color: #fff; padding: 11px 15px; border-radius: 13px; font-size: 14.5px; max-width: 92vw; transition: opacity .2s, transform .2s; display: flex; gap: 14px; align-items: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast button { border: 0; background: none; color: #ff9b7f; font-weight: 700; padding: 0; }

/* Error bar */
#errbar { display: none; position: fixed; z-index: 100; left: 8px; right: 8px; bottom: calc(var(--tb) + var(--sb) + 8px); max-height: 46vh; overflow: auto;
  background: #b3261e; color: #fff; border-radius: 13px; padding: 9px 11px; font-size: 13.5px; box-shadow: 0 8px 26px rgba(0,0,0,.35); }
#errbar .eh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
#errbar button { border: 0; background: rgba(255,255,255,.2); color: #fff; border-radius: 8px; padding: 5px 9px; margin-left: 5px; font-size: 13px; font-weight: 600; }
#errbar pre { margin: 8px 0 2px; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Menlo, monospace; }

/* Full-screen pages */
.page { position: fixed; z-index: 30; inset: 0; background: var(--bg); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .26s ease; }
.page.in { transform: none; }
.phd { flex: none; background: var(--head); color: #fff; padding: var(--st) 6px 0; min-height: calc(var(--hh) + var(--st)); display: flex; align-items: center; }
.phd .back { border: 0; background: none; color: #fff; font-size: 17px; padding: 8px 10px; min-width: 80px; text-align: left; }
.phd .pt { flex: 1; text-align: center; font-weight: 650; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phd .pr { min-width: 80px; text-align: right; }
.phd .pr button { border: 0; background: none; color: #fff; font-size: 15px; padding: 8px 10px; }
.pbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: calc(40px + var(--sb)); }
.pbody > .inner { max-width: 680px; margin: 0 auto; }

/* Bottom sheets */
.sheet-wrap { position: fixed; z-index: 40; inset: 0; }
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.42); opacity: 0; transition: opacity .22s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 680px; max-height: 86vh; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  background: var(--card); border-radius: 20px 20px 0 0; padding: 8px 16px calc(18px + var(--sb)); transform: translateY(100%); transition: transform .25s ease; }
.sheet-wrap.in .backdrop { opacity: 1; }
.sheet-wrap.in .sheet { transform: none; }
.shx { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--chip); color: var(--sub); font-size: 14px; font-weight: 700; display: grid; place-items: center; z-index: 2; }
.sheet h2 { padding-right: 38px; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 10px; }
.sheet h2 { margin: 2px 0 2px; font-size: 20px; }
.sheet .subl { color: var(--sub); font-size: 14px; margin-bottom: 6px; }
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 8px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 0; background: var(--chip); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chips button.on { background: var(--accent); color: #fff; }
.eprow { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.eprow.open { border-bottom: 0; }
.ep { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 11px 4px 11px 6px; font-size: 15px; }
.epi { flex: none; width: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--sub); }
.epi span { width: 23px; height: 23px; border: 1.6px solid currentColor; border-radius: 50%; display: grid; place-items: center; font: italic 700 13px/1 Georgia, serif; }
.epi.on { color: var(--accent); }
.syn { padding: 2px 12px 13px 66px; font-size: 14px; line-height: 1.45; border-bottom: 1px solid var(--line); }
.syn .dim { font-size: 13px; }
.infob { border: 0; background: none; padding: 0 2px; color: var(--sub); display: inline-grid; place-items: center; }
.infob span { width: 22px; height: 22px; border: 1.6px solid currentColor; border-radius: 50%; display: grid; place-items: center; font: italic 700 12.5px/1 Georgia, serif; }
.mi-top { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 10px; }
.mi-top .poster { width: 92px; height: 138px; border-radius: 11px; }
.mi-top h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.2; }
.mi-facts { font-size: 14px; color: var(--sub); line-height: 1.5; }
.cert { display: inline-block; border: 1.5px solid currentColor; border-radius: 4px; padding: 0 4px; font-size: 11.5px; font-weight: 700; color: var(--text); line-height: 1.5; }
.mi-rate { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 14px; }
.mi-rate .im b { background: #f5c518; color: #000; font-size: 10.5px; padding: 1px 4px; border-radius: 4px; margin-right: 3px; }
.tagline { font-style: italic; color: var(--sub); margin: 4px 0 8px; font-size: 15px; }
.mi-ov { font-size: 15px; line-height: 1.5; margin: 0 0 6px; }
.mi-h { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--sub); margin: 16px 0 6px; }
.mi-line { font-size: 15px; }
.cast { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cast::-webkit-scrollbar { display: none; }
.cast div { flex: none; width: 78px; text-align: center; font-size: 12.5px; line-height: 1.3; }
.cast img, .cast .noimg { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--chip); display: block; margin: 0 auto 5px; }
.cast b { display: block; font-weight: 600; }
.cast small { color: var(--sub); }
.mi-prov { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.mi-prov span { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.mi-prov img { width: 26px; height: 26px; border-radius: 6px; }
.pglinks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.pglink { background: var(--chip); color: var(--text); text-decoration: none; border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.ep .n { flex: none; width: 46px; font-weight: 700; }
.ep .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ep .d { flex: none; color: var(--sub); font-size: 13px; }
.ep .ck { flex: none; width: 20px; color: var(--good); font-weight: 800; }
.eprow.w .n, .eprow.w .nm { color: var(--sub); }
.eprow.cur { background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 10px; }
.eprow.fut .ep { opacity: .5; }
.pk-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn { display: block; width: 100%; border: 0; background: var(--accent); color: #fff; border-radius: 13px; padding: 13px 16px; font-size: 16px; font-weight: 650; }
.btn.ghost { background: var(--chip); color: var(--text); }
.btn.sm { padding: 10px 12px; font-size: 15px; }
.sheet .opt { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 4px; font-size: 16px; }
.sheet .opt small { color: var(--sub); }

/* Settings */
h3 { margin: 24px 28px 7px; font-size: 13px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; }
.group { margin: 0 16px; background: var(--card); border-radius: 14px; overflow: hidden; }
.group.pad { padding: 12px 14px; }
.gi { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 14px; font-size: 16px; text-align: left; }
.group > .gi:last-child { border-bottom: 0; }
.gi .gl { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; font-size: 16px; }
.gi .gl small { display: block; color: var(--sub); font-size: 13px; }
.gi .chev { margin-left: auto; color: var(--sub); }
.gi.add { color: var(--accent); font-weight: 600; }
.mini { flex: none; border: 0; background: var(--chip); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.danger { color: var(--danger); }
.note { margin: 7px 28px 0; font-size: 13px; color: var(--sub); }
.seg { display: flex; margin: 0 16px; background: var(--chip); border-radius: 11px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 9px; font-size: 14px; }
.seg button.on { background: var(--card); font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
label.fld { display: block; font-size: 13px; color: var(--sub); margin-bottom: 11px; }
input[type=text], input[type=search], input[type=password] { width: 100%; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); color: var(--text); margin-top: 5px; -webkit-appearance: none; appearance: none; }

'use strict';

const TMDB_KEY = '71fcbfa47781a86392bc05f2738bc2c8';

// Live-TV bundles never shown

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const view = $('#view');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function fmtDate(s, withDay = true) {
  if (!s) return '';
  const d = parseYmd(s), diff = daysBetween(today(), s);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  let out = (withDay && Math.abs(diff) < 180 ? WD[d.getDay()] + ' ' : '') + MO[d.getMonth()] + ' ' + d.getDate();
  if (d.getFullYear() !== new Date().getFullYear() && Math.abs(diff) >= 60) out += ', ' + d.getFullYear();

}
function fmtRun(m) { if (!m) return ''; return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + (m % 60) + 'm' : ''}` : m + 'm'; }

/* ---------- storage ---------- */
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { problem('Reading saved data', e); return null; } }
let D = load(LS_DATA);
if (!D || typeof D !== 'object' || !Array.isArray(D.profiles)) D = { profiles: [], active: null, tab: 'shows', lastRefresh: 0 };
D.settings = Object.assign({ win: 14, tmdbKey: '', omdbKey: '', mdbKey: '', ghToken: '', newAt: 'top', pg: false }, D.settings || {});
/* What each list's cards show (Settings → List view). Third value = default. */
const VIEW_OPTS = {
  tv: [['poster', 'Poster', 1], ['year', 'Year', 1], ['rt', 'Rotten Tomatoes 🍅', 0], ['pop', 'Popcornmeter 🍿', 0], ['imdb', 'IMDb rating', 0],
    ['runtime', 'Runtime per episode', 0], ['service', 'Streaming service', 0], ['next', 'Next episode date', 0], ['ended', '“Ended” tag', 1]],
  movie: [['poster', 'Poster', 1], ['year', 'Year', 1], ['runtime', 'Runtime', 1], ['rt', 'Rotten Tomatoes 🍅', 1], ['pop', 'Popcornmeter 🍿', 1],
    ['imdb', 'IMDb rating', 0], ['service', 'Streaming service', 0], ['upcoming', 'Upcoming release date', 1]]
};
D.settings.view = D.settings.view || {};
for (const kind of ['tv', 'movie']) { const v = D.settings.view[kind] = D.settings.view[kind] || {}; for (const [k, , def] of VIEW_OPTS[kind]) if (typeof v[k] !== 'boolean') v[k] = !!def; }
// 1.7.1: TV scores default to off (1.7.0 briefly had TV Rotten Tomatoes on)
if (D.settings.viewVer !== 2) { D.settings.view.tv.rt = false; D.settings.viewVer = 2; }
const V = (kind, k) => !!D.settings.view[kind][k];
let C = load(LS_CACHE);
if (!C || typeof C !== 'object') C = {};

function save() {
  let changed = false;
  for (const pr of D.profiles) if (pr.sync && stamp(pr) && pr.id === D.active) changed = true;
  try { localStorage.setItem(LS_DATA, JSON.stringify(D)); } catch (e) { problem('Saving your lists', e); }
  if (changed) scheduleSync();
}

/* =====================================================================
   SHARED PROFILES (sync between phones through a private GitHub gist)
   Every synced field carries its own timestamp (_u). Two phones merge
   field by field, newest wins; deletions are kept as "tombstones".
   ===================================================================== */
const GIST_FILE = 'watchlist-profile.json';
const GIST_DESC = 'Watchlist shared profile';
const SYNC_FIELDS = { tv: ['title', 'poster', 'year', 'rank', 'added', 'pos', 'sp', 'arch', 'archOn'], movie: ['title', 'poster', 'year', 'rank', 'added', 'seen', 'seenOn'] };
const ghToken = () => (D.settings.ghToken || '').trim();
const listOf = (pr, kind) => kind === 'tv' ? pr.shows : pr.movies;
const fieldSig = v => JSON.stringify(v === undefined ? null : v);
// Record what changed on this phone since the last save (field by field)
function stamp(pr) {
  const sy = pr.sync; sy.sig = sy.sig || {}; sy.tomb = sy.tomb || {};
  const now = Date.now(), seen = new Set(); let changed = false;
  for (const kind of ['tv', 'movie']) for (const it of listOf(pr, kind)) {
    const k = kind + ':' + it.id; seen.add(k);
    const sg = sy.sig[k] || (sy.sig[k] = {}); it._u = it._u || {};
    for (const f of SYNC_FIELDS[kind]) { const v = fieldSig(it[f]); if (sg[f] !== v) { sg[f] = v; it._u[f] = now; changed = true; } }
  }
  for (const k of Object.keys(sy.sig)) if (!seen.has(k)) { delete sy.sig[k]; sy.tomb[k] = now; changed = true; }
  return changed;
}
function syncPayload(pr) {
  const pick = kind => listOf(pr, kind).slice().sort(byRank).map(it => {
    const o = { id: it.id }; for (const f of SYNC_FIELDS[kind]) o[f] = it[f] === undefined ? null : it[f];
    o._u = it._u || {}; return o;
  });
  return JSON.stringify({ app: 'watchlist', format: 1, name: pr.name, shows: pick('tv'), movies: pick('movie'), tomb: pr.sync.tomb || {} });
}
function mergeRemote(pr, remote) {
  const sy = pr.sync, tomb = Object.assign({}, remote.tomb || {});
  for (const [k, at] of Object.entries(sy.tomb || {})) tomb[k] = Math.max(tomb[k] || 0, at);
  const cutoff = Date.now() - 120 * 864e5;
  for (const k of Object.keys(tomb)) if (tomb[k] < cutoff) delete tomb[k];
  for (const kind of ['tv', 'movie']) {
    const L = new Map(listOf(pr, kind).map(i => [i.id, i]));
    const R = new Map(((kind === 'tv' ? remote.shows : remote.movies) || []).filter(i => i && i.id).map(i => [i.id, i]));
    const out = [];
    for (const id of new Set([...L.keys(), ...R.keys()])) {
      const l = L.get(id), r = R.get(id); let m;
      if (l && r) {
        m = l; m._u = Object.assign({}, l._u);
        for (const f of SYNC_FIELDS[kind]) { const lu = (l._u || {})[f] || 0, ru = (r._u || {})[f] || 0; if (ru > lu) { m[f] = r[f]; m._u[f] = ru; } }
      } else if (l) m = l;
      else m = Object.assign(kind === 'tv' ? { pos: null, sp: [], arch: false, archOn: null } : { seen: false, seenOn: null, streaming: null, newly: null }, r, { _u: Object.assign({}, r._u) });
      const last = Math.max(0, ...Object.values(m._u || {}));
      const dead = tomb[kind + ':' + id];
      if (dead && dead >= last) continue;
      if (dead) delete tomb[kind + ':' + id];
      out.push(m);
    }
    out.sort((a, b) => (a.rank - b.rank) || (a.id - b.id));
    if (kind === 'tv') pr.shows = out; else pr.movies = out;
  }
  sy.tomb = tomb;
  // what we now hold counts as synced, not as a local change
  sy.sig = {};
  for (const kind of ['tv', 'movie']) for (const it of listOf(pr, kind)) {
    const sg = sy.sig[kind + ':' + it.id] = {}; for (const f of SYNC_FIELDS[kind]) sg[f] = fieldSig(it[f]);
  }
}
async function gh(method, path, body) {
  const t = ghToken();
  if (!t) throw new ApiError('No GitHub token on this phone. Add it in Settings → Sync between phones.', true);
  const opt = { method, cache: 'no-store', headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' } };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let res;
  try { res = await fetch('https://api.github.com' + path, opt); } catch (e) { throw new ApiError('Could not reach GitHub to sync. Check your internet connection.'); }
  if (res.status === 401) throw new ApiError('GitHub says the sync token is invalid or expired. Paste a new one in Settings → Sync between phones.', true);
  if (res.status === 403) throw new ApiError('GitHub refused the sync (403). The token may be missing the "gist" permission.', true);
  if (res.status === 404) throw new ApiError('The shared profile was not found on GitHub. It may have been deleted, or this token belongs to a different account.', true);
  if (!res.ok) throw new ApiError('GitHub error ' + res.status + ' while syncing.');
  return res.status === 204 ? null : res.json();
}
async function readGist(id) {
  const g = await gh('GET', `/gists/${encodeURIComponent(id)}`);
  const f = g && g.files && g.files[GIST_FILE];
  if (!f) return { gist: g, text: null, data: { shows: [], movies: [], tomb: {} } };
  let text = f.content;
  if (f.truncated && f.raw_url) text = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new ApiError("The shared profile's data on GitHub is damaged. Export a backup from the other phone and share again.", true); }
  return { gist: g, text, data };
}
let syncing = null, syncTimer = null;
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => { const pr = prof(); if (pr && pr.sync) syncProfile(pr).catch(e => problem('Sync', e)); }, 2500); }
function syncProfile(pr, opts = {}) {
  if (!pr || !pr.sync || !pr.sync.gist || !ghToken()) return Promise.resolve(false);
  if (syncing) return syncing.then(() => syncProfile(pr, opts));
  clearTimeout(syncTimer);
  syncing = (async () => {
    stamp(pr);
    const { text } = await readGist(pr.sync.gist).then(r => { pr._remote = r.data; return r; });
    stamp(pr); // catch any taps made while we were waiting on the network
    mergeRemote(pr, pr._remote); delete pr._remote;
    const payload = syncPayload(pr);
    if (payload !== text) await gh('PATCH', `/gists/${encodeURIComponent(pr.sync.gist)}`, { files: { [GIST_FILE]: { content: payload } } });
    pr.sync.at = Date.now(); pr.sync.err = null;
    try { localStorage.setItem(LS_DATA, JSON.stringify(D)); } catch (e) { problem('Saving your lists', e); }

    if (opts.toast) toast('Synced');

}
async function shareProfile(pr) {
  if (!ghToken()) { toast('Add your GitHub token first'); return; }
  pr.sync = { gist: null, sig: {}, tomb: {} };
  stamp(pr);
  try {
    const g = await gh('POST', '/gists', { description: `${GIST_DESC}: ${pr.name}`, public: false, files: { [GIST_FILE]: { content: syncPayload(pr) } } });
    pr.sync.gist = g.id; pr.sync.at = Date.now();

}
async function openJoin() {
  if (!ghToken()) { toast('Add your GitHub token first'); return; }
  const sh = showSheet('<h2>Join a shared profile</h2><p class="dim">Looking on GitHub…</p>');
  let list;
  try { list = (await gh('GET', '/gists?per_page=100')).filter(g => g.files && g.files[GIST_FILE]); }
  catch (e) { closeSheet(); problem('Join', e); return; }
  const mine = new Set(D.profiles.filter(x => x.sync).map(x => x.sync.gist));
  sh.el.innerHTML = `<h2>Join a shared profile</h2><div class="subl">Shared profiles in this GitHub account</div>` +
    (list.length ? list.map(g => `<button class="opt" data-act="joinGist" data-id="${esc(g.id)}"><span>${esc((g.description || GIST_DESC).replace(GIST_DESC + ': ', '') || 'Shared profile')}</span><small>${mine.has(g.id) ? '✓ On this phone' : 'Join ›'}</small></button>`).join('')

}
async function joinGist(id) {
  const have = D.profiles.find(x => x.sync && x.sync.gist === id);
  while (sheetStack.length) closeSheet();
  if (have) { D.active = have.id; save(); render(); rerenderSettings(); refresh(); toast(`Switched to “${have.name}”`); return; }
  const { data } = await readGist(id);
  let name = String(data.name || 'Shared').slice(0, 30); const names = new Set(D.profiles.map(x => x.name));
  for (let i = 2; names.has(name); i++) name = `${data.name || 'Shared'} ${i}`;
  const pr = { id: newId(), name, shows: [], movies: [], sync: { gist: id, sig: {}, tomb: {} } };
  D.profiles.push(pr); D.active = pr.id;
  await syncProfile(pr);
  for (const m of pr.movies) { const c = C['movie:' + m.id]; m.streaming = c ? c.providers.length > 0 : null; }
  save(); while (pageStack.length) closePage(); render(); refresh(); toast(`Joined “${name}”`);
}
function saveCache() {
  try { localStorage.setItem(LS_CACHE, JSON.stringify(C)); }
  catch (e) { pruneCache(); try { localStorage.setItem(LS_CACHE, JSON.stringify(C)); } catch (e2) { problem('Saving title data (phone storage may be full)', e2); } }
}
function pruneCache() {
  const keep = new Set();
  for (const p of D.profiles) { p.shows.forEach(s => keep.add('tv:' + s.id)); p.movies.forEach(m => keep.add('movie:' + m.id)); }

}
const prof = () => D.profiles.find(p => p.id === D.active) || D.profiles[0] || null;
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const byRank = (a, b) => a.rank - b.rank;
function normalizeRanks(list) { list.sort(byRank).forEach((x, i) => { x.rank = i + 1; }); }

/* ---------- API keys ---------- */
const isPlaceholder = k => !k || /^PASTE_/.test(k.trim());

const omdbKey = () => (D.settings.omdbKey || '').trim() || (isPlaceholder(OMDB_KEY) ? '' : OMDB_KEY.trim());

/* ---------- API calls ---------- */
class ApiError extends Error { constructor(msg, fatal) { super(msg); this.fatal = !!fatal; } }

async function tmdb(path, params = {}) {

  if (!key) throw new ApiError('No TMDB key yet. Add it in Settings → API keys (or in the code).', true);
  const u = new URL('https://api.themoviedb.org/3' + path);
  for (const [k, v] of Object.entries(params)) if (v != null) u.searchParams.set(k, v);
  const opt = { headers: { accept: 'application/json' } };
  if (key.length > 40) opt.headers.Authorization = 'Bearer ' + key; else u.searchParams.set('api_key', key);
  for (let attempt = 0; ; attempt++) {
    let res;
    try { res = await fetch(u, opt); } catch (e) { throw new ApiError('Could not reach TMDB. Check your internet connection.'); }
    if (res.status === 429 && attempt < 2) { await sleep(1200 * (attempt + 1)); continue; }
    if (res.status === 401) throw new ApiError('TMDB says the API key is invalid (401). Double-check the key.', true);
    if (res.status === 404) throw new ApiError('TMDB has no record of this title (404).');
    if (!res.ok) throw new ApiError('TMDB error ' + res.status + ' on ' + path.split('?')[0]);
    return res.json();
  }
}

async function omdb(imdbId) {
  const key = omdbKey();
  if (!key) return null;
  const u = `https://www.omdbapi.com/?i=${encodeURIComponent(imdbId)}&apikey=${encodeURIComponent(key)}`;
  let res;
  try { res = await fetch(u); } catch (e) { throw new ApiError('Could not reach OMDb (ratings).'); }
  let j = null;
  try { j = await res.json(); } catch (e) { /* not JSON */ }
  const msg = (j && j.Error) || '';
  if (res.status === 401 || /api key|limit/i.test(msg)) {
    throw new ApiError(/limit/i.test(msg) ? 'OMDb daily limit reached. Ratings will update tomorrow.'
      : 'OMDb says the key is invalid or not activated yet (click the link in the OMDb email).', true);
  }
  if (!res.ok) throw new ApiError('OMDb error ' + res.status);
  if (!j || j.Response === 'False') return null;
  return j;
}

async function mdblist(type, id) {
  const key = mdbKey(); if (!key) return null;
  const u = `https://api.mdblist.com/tmdb/${type === 'tv' ? 'show' : 'movie'}/${id}?apikey=${encodeURIComponent(key)}`;
  let res;
  try { res = await fetch(u); } catch (e) { throw new ApiError('Could not reach MDBList (ratings).'); }
  if (res.status === 401 || res.status === 403) throw new ApiError('MDBList says the key is invalid. Double-check it in Settings → API keys.', true);
  if (res.status === 429) throw new ApiError('MDBList daily limit reached. Ratings will update tomorrow.', true);
  if (res.status === 404) return null;
  if (!res.ok) throw new ApiError('MDBList error ' + res.status);
  const j = await res.json();
  if (!j || !Array.isArray(j.ratings)) return null;
  const val = src => { const r = j.ratings.find(x => String(x.source).toLowerCase() === src); return r && r.value != null && r.value !== '' ? r.value : null; };
  return { tomatoes: val('tomatoes'), popcorn: val('popcorn'), imdb: val('imdb') };
}

async function pool(items, n, fn, label) {
  let i = 0, fatal = null;
  const worker = async () => {
    while (!fatal && i < items.length) {
      const it = items[i++];
      try { await fn(it); }
      catch (e) { if (e && e.fatal) fatal = e; else problem(label(it), e); }
    }
  };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
  if (fatal) throw fatal;
}

/* Raw TMDB/JustWatch lists are cached; the rules below run every time, so rule changes apply at once */
function rawProv(wp) {
  const us = wp && wp.results && wp.results[REGION];
  const pick = list => (list || []).map(p => ({ id: p.provider_id, n: p.provider_name, l: p.logo_path, p: p.display_priority ?? 99 }));
  return us ? { sub: pick(us.flatrate), free: [...pick(us.free), ...pick(us.ads)] } : { sub: [], free: [] };
}
const isChannel = n => /\b(amazon|apple tv|roku premium) channel\b/i.test(n);
function brandOf(n) {
  let b = n.toLowerCase().replace(/\+/g, ' plus ')
    .replace(/\b(amazon|apple tv|roku premium) channel\b/g, ' ')
    .replace(/\b(premium plus|premium|essential|with showtime|standard with ads|basic with ads|with ads|ad-free|ad free|no ads|ultimate|basic|standard)\b/g, ' ')
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (b === 'hbo max') b = 'max';
  return b;
}
function tierOf(n) {
  const x = n.toLowerCase().replace(/\+/g, ' plus ');
  let t = /with ads|essential|\bbasic\b/.test(x) ? 0 : /premium plus|ultimate|with showtime/.test(x) ? 3 : /premium|ad-free|ad free|no ads/.test(x) ? 2 : 1;
  if (isChannel(n)) t += 10; // prefer the service's own app over an Amazon/Apple channel
  return t;
}
function cheapestPerBrand(list) {
  const best = new Map();
  for (const p of list) {
    const b = brandOf(p.n), cur = best.get(b);
    if (!cur || tierOf(p.n) < tierOf(cur.n) || (tierOf(p.n) === tierOf(cur.n) && p.p < cur.p)) best.set(b, p);
  }
  return [...best.values()].sort((a, b) => a.p - b.p);
}
/* Plain service name: "Peacock Premium Plus" -> "Peacock", "Paramount Plus Essential" -> "Paramount+" */
function shortName(n) {
  let x = String(n || '')
    .replace(/\s+(amazon|apple tv|roku premium) channel\s*$/i, '')
    .replace(/\s+(premium plus|premium|essential|with showtime|standard with ads|basic with ads|with ads|ad-free|ad free|no ads|ultimate)\s*$/i, '')
    .replace(/\s+(premium|essential)\s*$/i, '')
    .trim();
  x = x.replace(/\s+Plus$/i, '+').replace(/^Amazon Prime Video$/i, 'Prime Video').replace(/^Tubi TV$/i, 'Tubi');
  return x || n;
}
function provs(pv) {
  if (!pv) return [];
  const all = [...(pv.sub || []).map(p => Object.assign({ free: FREE_SVC.test(p.n) }, p)), ...(pv.free || []).map(p => Object.assign({}, p, { free: true }))]
    .filter(p => !LIVE_TV.test(p.n));
  const paid = all.filter(p => !p.free);
  const seen = new Set();
  return cheapestPerBrand(paid.length ? paid : all).map(p => ({ n: shortName(p.n), l: p.l }))
    .filter(p => !seen.has(p.n.toLowerCase()) && seen.add(p.n.toLowerCase()));
}

async function fetchTV(id, full) {
  const key = 'tv:' + id, prev = C[key];
  const d = await tmdb(`/tv/${id}`, { append_to_response: 'external_ids,watch/providers' });
  const e = {
    type: 'tv', id, title: d.name, year: (d.first_air_date || '').slice(0, 4), poster: d.poster_path || null,
    status: d.status || '', imdb: (d.external_ids && d.external_ids.imdb_id) || null,
    runtime: (d.episode_run_time && d.episode_run_time[0]) || (d.last_episode_to_air && d.last_episode_to_air.runtime) || (prev && prev.runtime) || null,
    pv: rawProv(d['watch/providers']),
    next: d.next_episode_to_air ? { s: d.next_episode_to_air.season_number, e: d.next_episode_to_air.episode_number, date: d.next_episode_to_air.air_date || '' } : null,
    seasons: Object.assign({}, prev && prev.seasons), detailsAt: today(),
    ratings: prev ? prev.ratings : null, ratingsAt: prev ? prev.ratingsAt : null
  };
  const lastS = d.last_episode_to_air ? d.last_episode_to_air.season_number : 0;
  const list = d.seasons || [];
  const present = new Set(list.map(s => String(s.season_number)));
  for (const k of Object.keys(e.seasons)) if (!present.has(k)) delete e.seasons[k];
  const t = today();
  const need = list.filter(s => {
    const n = s.season_number, c = e.seasons[n];
    if (full || !c || c.count !== s.episode_count) return true;
    if (n === 0) return c.eps.some(ep => !ep[1] || ep[1] > t);
    return n >= lastS;
  }).map(s => s.season_number);
  for (let i = 0; i < need.length; i += 20) {
    const chunk = need.slice(i, i + 20);
    const r = await tmdb(`/tv/${id}`, { append_to_response: chunk.map(n => 'season/' + n).join(',') });
    for (const n of chunk) {
      const sd = r['season/' + n];
      if (sd && Array.isArray(sd.episodes)) e.seasons[n] = { count: sd.episodes.length, eps: sd.episodes.map(ep => [ep.episode_number, ep.air_date || '', ep.name || '']) };
    }
  }
  e.providers = provs(e.pv);
  C[key] = e;
  return e;
}

function usDates(rd) {
  const out = { th: null, dig: null };
  const us = ((rd && rd.results) || []).find(r => r.iso_3166_1 === REGION);
  if (!us) return out;
  let t3 = null, t2 = null;
  for (const r of us.release_dates || []) {
    const d = (r.release_date || '').slice(0, 10); if (!d) continue;
    if (r.type === 3 && (!t3 || d < t3)) t3 = d;
    if (r.type === 2 && (!t2 || d < t2)) t2 = d;
    if (r.type === 4 && (!out.dig || d < out.dig)) out.dig = d;
  }
  out.th = t3 || t2;
  return out;
}

async function fetchMovie(id) {
  const key = 'movie:' + id, prev = C[key];
  const d = await tmdb(`/movie/${id}`, { append_to_response: 'watch/providers,release_dates' });
  const dt = usDates(d.release_dates);
  C[key] = {
    type: 'movie', id, title: d.title, year: (d.release_date || '').slice(0, 4), poster: d.poster_path || null,
    runtime: d.runtime || null, imdb: d.imdb_id || null, pv: rawProv(d['watch/providers']),
    release: d.release_date || '', th: dt.th, dig: dt.dig, detailsAt: today(),
    ratings: prev ? prev.ratings : null, ratingsAt: prev ? prev.ratingsAt : null
  };
  C[key].providers = provs(C[key].pv);
  return C[key];
}

async function fetchRatings(key) {
  const e = C[key]; if (!e) return;
  let r = null;
  if (mdbKey()) {
    try {
      const m = await mdblist(e.type, e.id);
      if (m && (m.tomatoes != null || m.imdb != null || m.popcorn != null))
        r = { rt: m.tomatoes != null ? m.tomatoes + '%' : null, pop: m.popcorn != null ? m.popcorn + '%' : null, imdb: m.imdb != null ? String(m.imdb) : null, src: 'mdb' };
    } catch (err) { if (err.fatal || !omdbKey()) throw err; problem('MDBList', err); }
  }
  if (!r && omdbKey() && e.imdb) {
    const j = await omdb(e.imdb);
    const rt = j && Array.isArray(j.Ratings) ? (j.Ratings.find(x => x.Source === 'Rotten Tomatoes') || {}).Value : null;
    const im = j && j.imdbRating && j.imdbRating !== 'N/A' ? j.imdbRating : null;
    r = { rt: rt || null, pop: null, imdb: im, src: 'omdb' };
  }
  if (!r) r = { rt: null, pop: null, imdb: null, src: mdbKey() ? 'mdb' : 'omdb' };
  e.ratings = r;
  e.ratingsAt = today();
}
const ratingsStale = (c, t, force) => !c.ratingsAt || daysBetween(c.ratingsAt, t) >= (force ? 1 : 7) || (mdbKey() && !(c.ratings && c.ratings.src === 'mdb'));

const keyTitle = k => { const c = C[k]; if (c) return c.title; const [type, id] = k.split(':'); const p = prof(); const x = p && (type === 'tv' ? p.shows : p.movies).find(i => i.id === +id); return x ? x.title : k; };

/* ---------- refresh ---------- */
let refreshing = false, queued = null;
async function refresh(opts = {}) {
  const force = !!opts.force;
  const p = prof();
  if (!p) return;
  if (refreshing) { queued = { force: force || !!(queued && queued.force) }; return; }
  if (!tmdbKey()) { if (force) toast('Add the TMDB key first (Settings → API keys)'); return; }
  refreshing = true; $('#refBtn').classList.add('spin');
  let ok = true;
  try {
    if (p.sync && ghToken()) { try { await syncProfile(p); } catch (e) { problem('Sync', e); } }
    const t = today();
    const keys = [...p.shows.map(s => 'tv:' + s.id), ...p.movies.map(m => 'movie:' + m.id)];
    const seenMovie = new Set(p.movies.filter(m => m.seen).map(m => 'movie:' + m.id));
    const jobs = keys.filter(k => seenMovie.has(k) ? !C[k] : (force || !C[k] || C[k].detailsAt !== t));
    await pool(jobs, 4, async k => {
      const [type, id] = k.split(':');
      if (type === 'tv') await fetchTV(+id, force); else await fetchMovie(+id);
    }, k => `Updating "${keyTitle(k)}"`);
    if (ratingsOn()) {
      const rjobs = keys.filter(k => !seenMovie.has(k) && C[k] && ratingsStale(C[k], t, force));
      await pool(rjobs, 3, fetchRatings, k => `Ratings for "${keyTitle(k)}"`);
    }
    D.lastRefresh = Date.now();
  } catch (e) {
    ok = false; problem('Refresh', e);
  } finally {
    saveCache();
    reconcile(p);
    if (D.tab === 'movies') moviesShown(false);
    save();
    refreshing = false; $('#refBtn').classList.remove('spin');
    render();
    if (force && ok) toast('Up to date');
    if (queued) { const q = queued; queued = null; refresh(q); }
  }
}

/* Compare fresh data with what this profile last knew: auto-unarchive, newly streaming */
function reconcile(p) {
  if (!p) return;
  for (const s of p.shows) {
    if (!s.arch) continue;
    const st = showState(s);
    if (st.newSinceArch) { s.arch = false; s.archOn = null; toast(`"${titleOf(s)}" has a new episode — back in Watching`); }
  }
  for (const m of p.movies) {
    if (m.seen) continue;
    const c = C['movie:' + m.id]; if (!c) continue;
    const on = c.providers.length > 0;
    if (m.streaming === false && on) m.newly = { name: c.providers[0].n, viewed: false };
    if (!on) m.newly = null;
    m.streaming = on;
  }
}

/* "Newly Streaming" badges: shown during one visit to the Movies tab, cleared on the next visit */
function moviesShown(isNewVisit) {
  const p = prof(); if (!p) return;
  for (const m of p.movies) {
    if (!m.newly) continue;
    if (m.newly.viewed && isNewVisit) m.newly = null;
    else m.newly.viewed = true;
  }
  save();
}

/* ---------- show / movie status ---------- */
const titleOf = x => { const c = C[(x.pos !== undefined ? 'tv:' : 'movie:') + x.id]; return (c && c.title) || x.title; };

function showState(s) {
  const c = C['tv:' + s.id];
  if (!c || !c.seasons) return { loaded: false, section: 'watching', html: '<span class="dim">Loading…</span>', canPlus: false };
  const t = today(), win = +D.settings.win || 0;
  const reg = [];
  for (const [n, se] of Object.entries(c.seasons)) { const sn = +n; if (!sn) continue; for (const ep of se.eps) reg.push({ s: sn, e: ep[0], d: ep[1] }); }
  reg.sort((a, b) => a.s - b.s || a.e - b.e);
  const p = s.pos;
  const after = x => !p || x.s > p[0] || (x.s === p[0] && x.e > p[1]);
  const aired = d => !!d && d <= t;
  const rest = reg.filter(after);
  const behindEps = rest.filter(x => aired(x.d));
  const sp = (c.seasons[0] && c.seasons[0].eps) || [];
  const spW = new Set(s.sp || []);
  const newSp = sp.filter(ep => aired(ep[1]) && ep[1] > (s.added || '') && !spW.has(ep[0]));
  const fut = [...rest.filter(x => x.d && x.d > t).map(x => x.d), ...sp.filter(ep => ep[1] > t && !spW.has(ep[0])).map(ep => ep[1])];
  if (c.next && c.next.date && c.next.date > t) fut.push(c.next.date);
  const nextDate = fut.length ? fut.sort()[0] : null;
  const ended = /^(ended|canceled|cancelled)$/i.test(c.status || '');
  const upToDate = !behindEps.length && !newSp.length;
  const anyAired = reg.some(x => aired(x.d));
  let section = 'uptodate';
  if (!upToDate) section = 'watching';
  else if (nextDate && win > 0 && daysBetween(t, nextDate) <= win) section = 'watching';
  const posL = p ? `S${p[0]}E${p[1]}` : 'Not started';
  const ok = '<span class="ok">Up to date</span>';
  let html;
  if (!upToDate) {
    const parts = [];
    if (behindEps.length) parts.push(`<span class="behind">${behindEps.length} behind</span>`);
    if (newSp.length) parts.push(`<span class="behind">${newSp.length} new special${newSp.length > 1 ? 's' : ''}</span>`);
    html = `${posL} · ${parts.join(' · ')}`;
  } else if (!p && !anyAired) html = `Not started · <span class="dim">Not aired yet</span>`;
  else html = `${posL} · ${ok}`;
  const endedTag = ended && upToDate && !!p;
  const newSinceArch = !!(s.arch && s.archOn && (behindEps.some(x => x.d > s.archOn) || newSp.some(ep => ep[1] > s.archOn)));
  return { loaded: true, section, html, endedTag, upToDate, nextDate, canPlus: behindEps.length > 0, nextEp: behindEps[0] || null, newSinceArch };
}

function movieState(m) {
  const c = C['movie:' + m.id];
  if (!c) return { sec: 'not', html: '<span class="dim">Loading…</span>' };
  if (m.seen) return { sec: 'seen', html: `<span class="dim">Seen${m.seenOn ? ' ' + fmtDate(m.seenOn, false) : ''}</span>` };
  if (m.newly) return { sec: 'new', html: `<span class="badge">Now on ${esc(shortName(m.newly.name))}</span>` };
  if (c.providers.length) return { sec: 'now', html: '' };
  const t = today();
  // only upcoming dates on the card; past dates live in the details sheet
  const up = c.th && c.th > t ? `Theaters ${fmtDate(c.th, false)}` : c.dig && c.dig > t ? `Digital ${fmtDate(c.dig, false)}` : c.release && c.release > t ? `Out ${fmtDate(c.release, false)}` : '';
  return { sec: 'not', html: up && V('movie', 'upcoming') ? `<span class="dim">${up}</span>` : '' };
}

/* ---------- card HTML ---------- */
function posterHtml(path, title, size = 'w185') {

function ratingsHtml(c) {

  if (c.ratings.rt) h += `<span class="rt">🍅 ${esc(c.ratings.rt)}</span>`;

function cardScores(c, kind) {

const cardPoster = (kind, path, title) => V(kind, 'poster') ? posterHtml(path, title, 'w92') : '';
const cardYear = (kind, year) => year && V(kind, 'year') ? ` <span class="yr">${esc(year)}</span>` : '';

function showCard(s, mode) {

function movieCard(m) {
  const c = C['movie:' + m.id], st = movieState(m);

function keyBanner() {

  document.body.classList.toggle('welcome', !D.profiles.length);

function renderMovies() {
  const p = prof();

  const groups = [['new', 'Newly Streaming'], ['now', 'Streaming Now'], ['not', 'Not Streaming Yet']];
  const nSeen = p.movies.length - act.length;
  let h = keyBanner() + `<div class="ph"><h1>Movies</h1><button class="pill" data-act="seenList">Seen${nSeen ? ' (' + nSeen + ')' : ''}</button></div>`;
  if (!act.length) h += `<div class="empty"><b>No movies yet</b>Tap + at the top to search for a movie or stand-up special.</div>`;

/* Drag-to-rank: the dragged section's items swap rank "slots" among themselves; nobody else moves */
function applyOrder(list, ids) {
  const items = ids.map(id => list.find(x => String(x.id) === String(id))).filter(Boolean);
  const slots = items.map(x => x.rank).sort((a, b) => a - b);

}
function onReorder(ids, listEl) {
  const p = prof(); const list = listEl.dataset.kind === 'tv' ? p.shows : p.movies;
  applyOrder(list, ids); normalizeRanks(list); save(); render();

/* ---------- gestures: long-press drag, swipe-left actions ---------- */
const G = { st: null, openRow: null, suppress: 0 };
const rowCard = row => row.querySelector(':scope > .card');
const actsW = row => { const a = row.querySelector(':scope > .acts'); return a ? a.offsetWidth : 0; };
function closeRow(row) {
  if (!row) return; const c = rowCard(row); if (c) { c.classList.add('snap'); c.style.transform = ''; }
  row.classList.remove('open'); if (G.openRow === row) G.openRow = null;
  setTimeout(() => { if (!row.classList.contains('open') && !(G.st && G.st.row === row && G.st.mode === 'swipe')) row.classList.remove('swiping'); }, 240);
}
function openRow(row) {

  row.classList.add('open'); G.openRow = row;
}
function attachGestures(list, opts) {

    if (e.touches.length !== 1) return;
    const t = e.touches[0], row = e.target.closest('.row');
    if (G.openRow && G.openRow !== row) closeRow(G.openRow);
    if (!row || row.parentElement !== list) return;
    const st = G.st = { list, row, opts, x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY, mode: 'pending',
      base: row.classList.contains('open') ? -actsW(row) : 0, cur: 0 };
    if (opts.sortable && opts.handleSel && e.target.closest(opts.handleSel)) startDrag();
    else if (opts.sortable && opts.longPress) st.timer = setTimeout(() => { if (G.st === st && st.mode === 'pending') startDrag(); }, 420);
  }, { passive: true });
  list.addEventListener('touchmove', e => {
    const st = G.st; if (!st || st.list !== list) return;
    const t = e.touches[0]; st.x = t.clientX; st.y = t.clientY;

    if (st.mode === 'drag') { e.preventDefault(); dragMove(); return; }
    if (st.mode === 'pending') {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      clearTimeout(st.timer);
      if (st.opts.swipe && actsW(st.row) && Math.abs(dx) > Math.abs(dy)) { st.mode = 'swipe'; st.row.classList.add('swiping'); rowCard(st.row).classList.remove('snap'); }

    if (sc === window) { top = 60; bot = innerHeight - 60; } else { const b = sc.getBoundingClientRect(); top = b.top; bot = b.bottom; }

    if (st.y < top + edge) v = -Math.ceil((top + edge - st.y) / 7);
    else if (st.y > bot - edge) v = Math.ceil((st.y - (bot - edge)) / 7);

document.addEventListener('click', e => {

  if (G.openRow && !e.target.closest('.acts')) {
    const inside = G.openRow.contains(e.target); closeRow(G.openRow);
    if (inside) { e.preventDefault(); e.stopPropagation(); }

/* ---------- pull to refresh ---------- */
(function () {
  const el = $('#ptr'); let P = null; const TH = 85;
  const set = d => { if (!d) { el.classList.remove('show'); el.style.opacity = 0; return; } el.classList.add('show'); el.style.opacity = Math.min(1, d / TH); el.textContent = d > TH ? 'Release to refresh' : 'Pull to refresh'; };
  document.addEventListener('touchstart', e => {
    P = null;
    if (pageStack.length || sheetStack.length || !D.profiles.length || e.touches.length !== 1) return;
    if (window.scrollY <= 0) P = { y0: e.touches[0].clientY, d: 0 };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!P) return;
    if (G.st && (G.st.mode === 'drag' || G.st.mode === 'swipe')) { P = null; set(0); return; }
    const d = e.touches[0].clientY - P.y0; P.d = d > 0 ? d : 0; set(P.d);
  }, { passive: true });
  document.addEventListener('touchend', () => { if (!P) return; const go = P.d > TH; P = null; set(0); if (go) refresh({ force: true }); }, { passive: true });
})();

/* ---------- pages (full screen) and sheets (bottom) ---------- */
const pageStack = [], sheetStack = [];
function openPage(title, body, opts = {}) {

/* ---------- episode picker ---------- */
let picker = null; // { id, season, sh, open }
const OV = {}; // episode summaries, fetched on demand and kept in memory only (keeps phone storage small)
async function loadSummaries(id, sn) {
  const k = id + ':' + sn; if (OV[k]) return;
  OV[k] = { loading: true, eps: {} };
  try {
    const d = await tmdb(`/tv/${id}/season/${sn}`);
    for (const ep of d.episodes || []) OV[k].eps[ep.episode_number] = { o: ep.overview || '', r: ep.runtime || null };

}
function openPicker(id) {

  picker = { id: +id, season: null, sh, open: new Set() };

}
function renderPicker() {
  if (!picker) return;
  const s = findShow(picker.id); if (!s) { closeSheet(); return; }
  const c = C['tv:' + s.id], el = picker.sh.el;
  const head = `<h2>${esc(titleOf(s))}</h2><div class="subl">${s.pos ? `You're at S${s.pos[0]}E${s.pos[1]}` : "You haven't started"} · tap the last episode you watched, or <b>i</b> for a summary</div>`;
  if (!c || !c.seasons) { el.innerHTML = head + `<p class="dim">Loading episodes…</p>`; return; }
  const nums = Object.keys(c.seasons).map(Number).filter(n => n > 0 && c.seasons[n].eps.length).sort((a, b) => a - b);
  const hasSp = c.seasons[0] && c.seasons[0].eps.length;
  if (picker.season == null || (picker.season !== 0 && !nums.includes(picker.season))) {
    const st = showState(s);
    picker.season = st.nextEp ? st.nextEp.s : (s.pos ? s.pos[0] : (nums[0] || 0));
    if (!nums.includes(picker.season) && picker.season !== 0) picker.season = nums[0] || 0;
  }
  const t = today(), sn = picker.season;

    (hasSp ? `<button class="${sn === 0 ? 'on' : ''}" data-act="pkSeason" data-s="0">Specials</button>` : '');
  const eps = (c.seasons[sn] && c.seasons[sn].eps) || [];
  const spW = new Set(s.sp || []);
  const rows = eps.map(([e, d, name]) => {

    let w, cur = false;
    if (sn === 0) w = spW.has(e);
    else { w = !!s.pos && (sn < s.pos[0] || (sn === s.pos[0] && e <= s.pos[1])); cur = !!s.pos && sn === s.pos[0] && e === s.pos[1]; }
    const open = picker.open.has(sn + ':' + e);
    let syn = '';

      syn = `<div class="syn">${!ov || ov.loading ? '<span class="dim">Loading summary…</span>'

    }

      <span class="ck">${w ? '✓' : ''}</span><span class="n">${sn === 0 ? 'SP' : 'E'}${e}</span><span class="nm">${esc(name || 'Episode ' + e)}</span><span class="d">${d ? fmtDate(d, false) : 'TBA'}</span></button><button class="epi ${open ? 'on' : ''}" data-act="pkInfo" data-s="${sn}" data-e="${e}" aria-label="Episode summary"><span>i</span></button></div>${syn}`;

let lastResults = [], searchSeq = 0;
function openSearch() {
  if (!tmdbKey()) { toast('Add the TMDB key first (Settings → API keys)'); return; }
  openPage('Add a title', () => `<div class="search"><input id="q" type="search" placeholder="Search TV shows and movies" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
    <div id="results"><p class="hint">Shows go to the Shows tab; movies and stand-up specials go to Movies.</p></div>`,
    { after: pg => { const q = pg.body.querySelector('#q'); q.focus(); q.addEventListener('input', debounce(() => doSearch(q.value, pg), 350)); q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); }); } });
}
async function doSearch(q, pg) {
  q = q.trim(); const box = pg.body.querySelector('#results'); const seq = ++searchSeq;
  if (q.length < 2) { box.innerHTML = '<p class="hint">Keep typing…</p>'; return; }
  box.innerHTML = '<p class="hint">Searching…</p>';
  try {
    const j = await tmdb('/search/multi', { query: q, include_adult: 'false', language: 'en-US' });
    if (seq !== searchSeq) return;
    lastResults = (j.results || []).filter(r => r.media_type === 'tv' || r.media_type === 'movie').slice(0, 20);
    if (!lastResults.length) { box.innerHTML = '<p class="hint">No matches. Try a different spelling.</p>'; return; }
    renderResults(box);
  } catch (e) { if (seq === searchSeq) box.innerHTML = '<p class="hint">Search failed — see the red box.</p>'; problem('Search', e); }
}
function renderResults(box) {
  const p = prof();
  box.innerHTML = lastResults.map((r, i) => {
    const tv = r.media_type === 'tv', title = tv ? r.name : r.title, yr = ((tv ? r.first_air_date : r.release_date) || '').slice(0, 4);
    const inList = (tv ? p.shows : p.movies).some(x => x.id === r.id);
    return `<button class="res" data-act="addRes" data-i="${i}">${posterHtml(r.poster_path, title, 'w92')}<span class="rt2"><b>${esc(title)}</b><small><span class="tp">${tv ? 'TV' : 'MOVIE'}</span>${esc(yr)}</small></span>${inList ? '<span class="inl">✓ In list</span>' : ''}</button>`;
  }).join('');
}
async function addResult(r) {
  const p = prof(), tv = r.media_type === 'tv', list = tv ? p.shows : p.movies;
  if (list.some(x => x.id === r.id)) { toast('Already in your list'); return; }
  const base = { id: r.id, title: tv ? r.name : r.title, poster: r.poster_path || null, year: ((tv ? r.first_air_date : r.release_date) || '').slice(0, 4),
    rank: !list.length ? 1 : D.settings.newAt === 'bottom' ? Math.max(...list.map(x => x.rank)) + 1 : Math.min(...list.map(x => x.rank)) - 1, added: today() };
  const item = tv ? Object.assign(base, { pos: null, sp: [], arch: false, archOn: null })
    : Object.assign(base, { seen: false, seenOn: null, streaming: null, newly: null });
  list.push(item); normalizeRanks(list); save();
  while (pageStack.length) closePage();
  D.tab = tv ? 'shows' : 'movies'; save();
  render(); window.scrollTo(0, 0);
  if (tv) openPicker(item.id); else toast(`Added to Movies`);
  try {
    if (tv) await fetchTV(item.id, true); else await fetchMovie(item.id);
    const key = (tv ? 'tv:' : 'movie:') + item.id;
    if (!tv) { item.streaming = C[key].providers.length > 0; }
    saveCache(); save(); render(); renderPicker();
    if (ratingsOn()) { try { await fetchRatings(key); saveCache(); render(); } catch (e) { problem('Ratings', e); } }
  } catch (e) { problem(`Adding "${item.title}"`, e); if (picker && picker.id === item.id) closeSheet(); render(); }
}

function exportBackup() {
  const p = prof();
  const data = { app: 'watchlist', format: 1, version: APP_VERSION, exportedAt: new Date().toISOString(), profile: { name: p.name, shows: p.shows, movies: p.movies } };
  const slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'profile';
  const name = `watchlist-${slug}-${today()}.json`;
  const text = JSON.stringify(data);
  let file = null;
  try { file = new File([text], name, { type: 'application/json' }); } catch (e) { /* older browser */ }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Watchlist backup' }).catch(e => { if (e.name !== 'AbortError') problem('Sharing the backup', e); });
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Backup saved');
}
function cleanImport(obj) {
  if (!obj || obj.app !== 'watchlist' || !obj.profile) throw new Error("That file isn't a Watchlist backup.");
  const pr = obj.profile, num = v => (Number.isFinite(+v) ? +v : 0);
  const shows = (Array.isArray(pr.shows) ? pr.shows : []).filter(s => s && num(s.id)).map(s => ({
    id: num(s.id), title: String(s.title || ''), poster: s.poster || null, year: String(s.year || ''), rank: num(s.rank),
    pos: Array.isArray(s.pos) && s.pos.length === 2 ? [num(s.pos[0]), num(s.pos[1])] : null,
    sp: Array.isArray(s.sp) ? s.sp.map(num) : [], added: s.added || today(), arch: !!s.arch, archOn: s.archOn || null }));
  const movies = (Array.isArray(pr.movies) ? pr.movies : []).filter(m => m && num(m.id)).map(m => ({
    id: num(m.id), title: String(m.title || ''), poster: m.poster || null, year: String(m.year || ''), rank: num(m.rank),
    seen: !!m.seen, seenOn: m.seenOn || null, streaming: typeof m.streaming === 'boolean' ? m.streaming : null, newly: null, added: m.added || today() }));
  normalizeRanks(shows); normalizeRanks(movies);
  return { name: String(pr.name || 'Imported').slice(0, 30), shows, movies };
}
let pendingImport = null;
async function handleImportFile(file) {
  let data;
  try { data = cleanImport(JSON.parse(await file.text())); }
  catch (e) { problem('Import', e.message && /JSON/.test(e.message) ? new Error("Couldn't read that file — is it a Watchlist backup?") : e); return; }
  if (!D.profiles.length) { importAsNew(data); return; }
  pendingImport = data;
  const p = prof();
  showSheet(`<h2>Import “${esc(data.name)}”</h2><div class="subl">${data.shows.length} shows · ${data.movies.length} movies</div>
    <button class="opt" data-act="impNew"><span>Add as a new profile</span><small>›</small></button>
    <button class="opt" data-act="impReplace"><span>Replace “${esc(p.name)}”</span><small>${p.sync ? 'shared: changes it on every phone' : 'overwrites its lists'}</small></button>
    <button class="opt" data-act="closeSheet"><span>Cancel</span></button>`);
}
function importAsNew(data) {
  let name = data.name; const names = new Set(D.profiles.map(p => p.name));
  for (let i = 2; names.has(name); i++) name = `${data.name} ${i}`;
  const p = { id: newId(), name, shows: data.shows, movies: data.movies };
  D.profiles.push(p); D.active = p.id; finishImport(`Imported “${name}”`);
}
function finishImport(msg) {
  save(); while (sheetStack.length) closeSheet(); while (pageStack.length) closePage();
  reconcile(prof()); save(); render(); toast(msg); refresh();
}

      <button class="btn ghost" data-act="welcomeJoin" style="margin-top:8px">Join a shared profile</button></div></div>`;
}

/* ---------- actions (every button with data-act) ---------- */
const ACT = {
  tab(b) { const tab = b.dataset.tab; const was = D.tab; D.tab = tab; save(); if (tab === 'movies' && was !== 'movies') moviesShown(true); render(); window.scrollTo(0, 0); },
  refresh() { refresh({ force: true }); },
  forceRefresh() { refresh({ force: true }); },
  add() { openSearch(); },
  settings() { while (sheetStack.length) closeSheet(); openSettings(); },
  back() { closePage(); },
  closeSheet() { closeSheet(); },
  profiles() { profilesSheet(); },
  archive() { openArchive(); },
  seenList() { openSeen(); },
  addRes(b) { const r = lastResults[+b.dataset.i]; if (r) addResult(r); },

  picker(b) { openPicker(b.dataset.id); },
  pkSeason(b) { picker.season = +b.dataset.s; renderPicker(); picker.sh.el.parentElement.scrollTop = 0; },
  pkEp(b) {
    const s = findShow(picker.id), sn = +b.dataset.s, e = +b.dataset.e;
    if (sn === 0) { const set = new Set(s.sp || []); set.has(e) ? set.delete(e) : set.add(e); s.sp = [...set]; save(); renderPicker(); render(); return; }
    const prev = s.pos; s.pos = [sn, e]; save(); closeSheet(); render();
    toast(`Set to S${sn}E${e}`, 'Undo', () => { s.pos = prev; save(); render(); });
  },
  movieInfo(b) { openInfo('movie', b.dataset.id); },
  showInfo(b) { openInfo('tv', b.dataset.id); },
  pkInfo(b) {
    const k = b.dataset.s + ':' + b.dataset.e;
    picker.open.has(k) ? picker.open.delete(k) : picker.open.add(k);
    renderPicker();
    if (picker.open.has(k)) loadSummaries(picker.id, +b.dataset.s);
  },
  pkNone() { const s = findShow(picker.id); const prev = s.pos; s.pos = null; save(); closeSheet(); render(); toast('Set to not started', 'Undo', () => { s.pos = prev; save(); render(); }); },
  pkLatest() {
    const s = findShow(picker.id), c = C['tv:' + s.id]; if (!c) return;
    const t = today(); let last = null;
    for (const [n, se] of Object.entries(c.seasons)) { if (!+n) continue; for (const ep of se.eps) if (ep[1] && ep[1] <= t && (!last || +n > last[0] || (+n === last[0] && ep[0] > last[1]))) last = [+n, ep[0]]; }
    if (!last) { toast('No episodes have aired yet'); return; }
    const prev = s.pos; s.pos = last; save(); closeSheet(); render();
    toast(`Caught up: S${last[0]}E${last[1]}`, 'Undo', () => { s.pos = prev; save(); render(); });
  },
  plus1(b) {
    const s = findShow(b.dataset.id), st = showState(s); if (!st.nextEp) return;
    const prev = s.pos; s.pos = [st.nextEp.s, st.nextEp.e]; save(); render();
    toast(`Watched S${st.nextEp.s}E${st.nextEp.e}`, 'Undo', () => { s.pos = prev; save(); render(); });
  },
  archShow(b) { const s = findShow(b.dataset.id); s.arch = true; s.archOn = today(); save(); render(); toast(`Archived “${titleOf(s)}”`, 'Undo', () => { s.arch = false; s.archOn = null; save(); render(); }); },
  unarchShow(b) { const s = findShow(b.dataset.id); s.arch = false; s.archOn = null; save(); render(); toast(`“${titleOf(s)}” is back in your list`); },
  delShow(b) {
    const p = prof(), s = findShow(b.dataset.id);
    if (!confirm(`Delete “${titleOf(s)}”?\n\nThis removes it completely. Only a backup can bring it back.`)) { closeRow(G.openRow); return; }
    p.shows = p.shows.filter(x => x !== s); normalizeRanks(p.shows); save(); render();
  },
  seen(b) { const m = findMovie(b.dataset.id); m.seen = true; m.seenOn = today(); m.newly = null; save(); render(); toast(`Moved “${titleOf(m)}” to Seen`, 'Undo', () => { m.seen = false; m.seenOn = null; save(); render(); }); },
  unseen(b) { const m = findMovie(b.dataset.id); m.seen = false; m.seenOn = null; save(); render(); toast(`“${titleOf(m)}” is back in your list`); refresh(); },
  delMovie(b) {
    const p = prof(), m = findMovie(b.dataset.id);
    if (!confirm(`Delete “${titleOf(m)}”?\n\nThis removes it completely. Only a backup can bring it back.`)) { closeRow(G.openRow); return; }
    p.movies = p.movies.filter(x => x !== m); normalizeRanks(p.movies); save(); render();
  },

  createProf() { const n = ($('#newProf').value || '').trim(); if (!n) { $('#newProf').focus(); return; } createProfile(n); render(); refresh(); },
  addProf() { const n = prompt('Name for the new profile:'); if (!n || !n.trim()) return; while (sheetStack.length) closeSheet(); createProfile(n); render(); rerenderSettings(); toast(`Switched to “${n.trim()}”`); },
  switchProf(b) { D.active = b.dataset.id; reconcile(prof()); save(); while (sheetStack.length) closeSheet(); render(); rerenderSettings(); window.scrollTo(0, 0); refresh(); },
  renameProf(b) { const p = D.profiles.find(x => x.id === b.dataset.id); const n = prompt('Rename profile:', p.name); if (!n || !n.trim()) return; p.name = n.trim().slice(0, 30); save(); render(); rerenderSettings(); },
  delProf(b) {
    const p = D.profiles.find(x => x.id === b.dataset.id);
    if (!confirm(`Delete the profile “${p.name}” and all its lists?\n\nExport a backup first if you might want it back.`)) return;
    D.profiles = D.profiles.filter(x => x !== p); if (D.active === p.id) D.active = D.profiles[0] ? D.profiles[0].id : null;
    pruneCache(); saveCache(); save();
    if (!D.profiles.length) { while (pageStack.length) closePage(); }
    render(); rerenderSettings();
  },
  export() { exportBackup(); },
  import() { $('#fileIn').click(); },
  impNew() { if (pendingImport) importAsNew(pendingImport); pendingImport = null; },
  impReplace() { if (!pendingImport) return; const p = prof(); p.shows = pendingImport.shows; p.movies = pendingImport.movies; pendingImport = null; finishImport(`Replaced “${p.name}” from backup`); },

  share() { const p = prof(); return shareProfile(p); },
  syncNow() { return syncProfile(prof(), { toast: true }); },
  unshare() {
    const p = prof();
    if (!confirm(`Stop sharing “${p.name}” on this phone?\n\nThis phone keeps its own copy and stops syncing. The other phone and the copy on GitHub are not changed.`)) return;
    delete p.sync; for (const it of [...p.shows, ...p.movies]) delete it._u; save(); render(); rerenderSettings();
  },
  joinShared() { return openJoin(); },
  welcomeJoin() {
    if (!ghToken()) {
      const t = prompt('Paste the GitHub token (the same one used on the other phone):');
      if (!t || !t.trim()) return;
      D.settings.ghToken = t.trim(); save();
    }
    return openJoin();
  },
  joinGist(b) { return joinGist(b.dataset.id); },
  saveToken() { D.settings.ghToken = ($('#kG').value || '').trim(); save(); document.activeElement && document.activeElement.blur(); rerenderSettings(); toast(D.settings.ghToken ? 'Token saved' : 'Token removed'); },
  viewTog(b) { const v = D.settings.view[b.dataset.kind]; v[b.dataset.k] = !v[b.dataset.k]; save(); rerenderSettings(); render(); },
  pg(b) { D.settings.pg = b.dataset.v === '1'; save(); rerenderSettings(); },
  newAt(b) { D.settings.newAt = b.dataset.v; save(); rerenderSettings(); },
  win(b) { D.settings.win = +b.dataset.v; save(); render(); rerenderSettings(); },
  saveKeys() {
    D.settings.tmdbKey = ($('#kT').value || '').trim(); D.settings.omdbKey = ($('#kO').value || '').trim(); D.settings.mdbKey = ($('#kM').value || '').trim(); save();
    document.activeElement && document.activeElement.blur(); rerenderSettings(); render(); toast('Keys saved'); refresh({ force: true });
  },
  rank(b) { openRank(b.dataset.kind); },
  rankAll() { const pg = pageStack[pageStack.length - 1]; pg.state.all = !pg.state.all; pg.render(); },
  rankTo(b) {
    const kind = b.dataset.kind, list = kind === 'tv' ? prof().shows : prof().movies;
    const rows = [...b.closest('.list').children].map(r => r.dataset.id);
    const from = rows.indexOf(b.dataset.id);
    const v = prompt(`Move to position (1–${rows.length}):`, String(from + 1)); if (v == null) return;
    let to = parseInt(v, 10); if (!Number.isFinite(to)) return;
    to = Math.max(1, Math.min(rows.length, to)) - 1;
    rows.splice(to, 0, rows.splice(from, 1)[0]);
    applyOrder(list, rows); normalizeRanks(list); save(); render();
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  e.preventDefault();
  try { const r = fn(b, e); if (r && r.catch) r.catch(err => problem(b.dataset.act, err)); }
  catch (err) { problem('Button "' + b.dataset.act + '"', err); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newProf') ACT.createProf(); });

/* ---------- auto-update: reload once when GitHub has a newer version ---------- */
async function checkUpdate() {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    const r = await fetch('./index.html?check=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION) return;
    let done = null; try { done = sessionStorage.getItem('watchlist.updatedTo'); sessionStorage.setItem('watchlist.updatedTo', m[1]); } catch (e) { /* ignore */ }
    if (done === m[1]) return;
    toast('Updating to v' + m[1] + '…');
    setTimeout(() => location.replace('./?v=' + encodeURIComponent(m[1])), 700);
  } catch (e) { /* offline: try again next open */ }
}

/* ---------- start ---------- */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!D.profiles.length) return;
  if (D.tab === 'movies' && Date.now() - hiddenAt > 10 * 60 * 1000) { moviesShown(true); render(); }
  refresh();
  checkUpdate();
});

(function init() {
  try {
    for (const e of Object.values(C)) if (e && e.pv) e.providers = provs(e.pv);
    for (const p of D.profiles) { p.shows = p.shows || []; p.movies = p.movies || []; normalizeRanks(p.shows); normalizeRanks(p.movies); }
    if (D.tab !== 'movies') D.tab = 'shows';
    if (D.profiles.length && D.tab === 'movies') moviesShown(true);
    render();
    if (D.profiles.length) refresh();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    checkUpdate();
  } catch (e) { problem('Starting up', e); }
})();
</script>
